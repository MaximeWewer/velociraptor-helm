{{- if eq (include "velociraptor.apiServed" .) "true" }}
# Master API (gRPC, mTLS with API client certificates), dialed by minions (RemoteFileDataStore)
# and api.expose clients at {{ include "velociraptor.fullname" . }}-api.{{ .Release.Namespace }}.svc when the chart manages
# the config. The master pod itself uses the loopback (no hairpin through this Service).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "velociraptor.fullname" . }}-api
  labels:
    {{- include "velociraptor.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.frontend.apiPort }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "velociraptor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: master
{{- end }}
