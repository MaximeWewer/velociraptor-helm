name: Release Helm Chart

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'chore/update-versions')
    # One release at a time: each one commits the stamped Chart.yaml to main.
    concurrency:
      group: release-helm
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      # Always release main's tip (also on the auto-merged PR event, whose default ref is
      # the PR merge commit), so that the stamped Chart.yaml can be pushed back to main.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Convert repository owner to lowercase
        id: lowercase
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set release version (today's date)
        id: chart
        run: |
          # Chart version = "<Velociraptor version>-DD-MM-YYYY" of the release day, whatever
          # Chart.yaml carried before: appVersion is the Velociraptor version (kept current
          # by update-versions.yml or by hand), the date is stamped here.
          APP=$(grep '^appVersion:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          TAG=$(grep -A1 'repository: maximewewer/velociraptor' chart/values.yaml | grep -oP 'tag: "\K[^"]+')
          if [ "$TAG" != "${APP}-distroless" ]; then
            echo "ERROR: appVersion ${APP} does not match image.tag ${TAG} in values.yaml" >&2
            exit 1
          fi
          VERSION="${APP}-$(date -u +'%d-%m-%Y')"
          sed -i "s/^version: .*/version: ${VERSION}/" chart/Chart.yaml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Commit the stamped Chart.yaml to main
        run: |
          if git diff --quiet chart/Chart.yaml; then
            echo "Chart.yaml already at ${{ steps.chart.outputs.version }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): ${{ steps.chart.outputs.version }}" chart/Chart.yaml
          # GITHUB_TOKEN pushes do not trigger other workflows (no CI loop).
          git push origin HEAD:main

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update chart dependencies
        run: |
          helm dependency update chart/

      - name: Package Helm chart
        run: |
          helm package chart/

      - name: Push Helm chart to GHCR
        run: |
          helm push velociraptor-${{ steps.chart.outputs.version }}.tgz oci://ghcr.io/${{ steps.lowercase.outputs.owner }}/charts
