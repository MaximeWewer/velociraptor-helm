# Default values for velociraptor.
# Quality baseline: MaximeWewer/intelowl-helm. Security baseline: distroless, rootless.

nameOverride: ""
fullnameOverride: ""

image:
  registry: "ghcr.io"
  # Hardened distroless/rootless rebuild — built & published from
  # https://github.com/MaximeWewer/velociraptor-docker
  repository: maximewewer/velociraptor
  tag: "0.77.1-distroless"
  # Pin by digest in production (overrides tag): sha256:...
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

## Server config.
## The Velociraptor server config embeds the server IDENTITY: the CA (which every enrolled
## agent pins), the Frontend/GUI private keys + certificates and the deployment nonces.
## Losing or regenerating it orphans every agent, so its lifecycle matters.
##
## Three sources, first match wins:
##   1. existingSecret — a Secret you manage (ESO/Vault/SealedSecrets).
##   2. inline         — the chart renders it into a Secret (keep it out of git).
##   3. bootstrap      — DEFAULT. A Job generates the identity in-cluster on first install,
##                       stores it in a Secret the chart never renders (never regenerated,
##                       never pruned by Helm/Argo, survives uninstall) and renews the
##                       server certificates before they expire. Nothing to generate by hand.
config:
  # Name of an existing Secret holding the server config.
  existingSecret: ""
  # Key within the Secret that holds the YAML config.
  secretKey: "server.config.yaml"
  # Mount path of the config file inside the container.
  mountPath: "/etc/velociraptor/server.config.yaml"
  # Inline server config — rendered into a chart-managed Secret. Use this when you
  # have no external secret manager. The value holds the CA/private keys, so DO NOT
  # commit it to git: keep it in a separate, gitignored overrides file and pass it at
  # install time, e.g.
  #   helm upgrade --install velo ./chart -f secrets.yaml         # secrets.yaml gitignored
  #   helm upgrade --install velo ./chart --set-file config.inline=server.config.yaml
  inline: ""

  ## In-cluster identity bootstrap & certificate renewal (used when neither existingSecret
  ## nor inline is set). Implemented in VQL (chart/files/pki.vql) and run by the chart's
  ## own Velociraptor image — no shell, no extra image.
  ##  - pre-install/pre-upgrade hook Job (Argo: PreSync): create the Secret if missing
  ##    (import it from `importFrom` if that Secret exists, else `config generate`);
  ##    renew the Frontend/GUI certificates if they expire within renewBeforeDays.
  ##  - CronJob: the same check on a schedule, so certificates are renewed even when
  ##    nobody upgrades the release for a year.
  ## Renewal = `config reissue_certs`: SAME CA, same private keys, same nonces — agents
  ## don't notice. The CA itself is valid 10 years and is never rotated automatically.
  bootstrap:
    enabled: true
    # Secret holding the generated config. Default: <fullname>-server-config.
    secretName: ""
    # Migration: when the bootstrap Secret does not exist yet, copy the config from this
    # Secret instead of generating a new identity (keeps the CA -> agents keep working).
    # Default: <fullname>-config, i.e. the Secret rendered by a former `config.inline`,
    # so switching from inline to bootstrap is seamless. Set an existing Secret name to
    # adopt a config generated out-of-band.
    importFrom: ""
    # Validity of the server certificates issued at generation and at each renewal.
    # Default = the CA's own lifetime (10 years), so a fresh install never renews: a
    # renewal is DISRUPTIVE because of an upstream client bug (Velociraptor <= 0.77.3 and
    # master): a running agent freezes "now" at process start when verifying the server
    # certificate, so it rejects any certificate issued after it started, and it never
    # restarts itself while the server is unreachable. After a renewal every running agent
    # stays disconnected until its process restarts (reboot / service restart).
    # Planned renewal without downtime (e.g. an imported config with 1-year certificates):
    #   1. renew with restartOnRenew=false (new certificate stored, server keeps the old one);
    #   2. restart the agents while they are still connected (hunt
    #      Admin.Client.UpdateClientConfig with RekeyClient=N, or your fleet tooling);
    #   3. restart the server: `kubectl rollout restart statefulset/<fullname>`.
    certificateValidityDays: 3650
    # Renew when a server certificate expires within this many days.
    renewBeforeDays: 30
    # After a renewal, delete the server pods (master + minions) so they reload the
    # certificates — the StatefulSets recreate them. Running pods only read them at start.
    restartOnRenew: true
    # The CronJob fails (-> alert) when the CA expires within this many days.
    caWarnDays: 180
    renewal:
      # Periodic check (CronJob). Bootstrap: renews. existingSecret / inline: read-only
      # check that fails when the certificates expire within renewBeforeDays (an alert,
      # since nothing renews a config managed outside the chart).
      enabled: true
      schedule: "17 3 * * *"
      # IANA time zone for the schedule (empty = kube-controller-manager's zone).
      timeZone: ""
    activeDeadlineSeconds: 300
    # The binary loads its whole artifact repository and spawns a second instance for
    # `config generate` / `reissue_certs`: measured OOM at 256Mi, OK at 384Mi.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Chart-managed operational config (split secrets / settings).
  # When true, the chart RENDERS the operational parts of the server config — ports,
  # bind addresses, hostnames, URLs, datastore, logging, monitoring, authenticator
  # type — from chart values and deep-merges them (via the yq overlay) onto your base
  # config. Your base (existingSecret/inline) then only needs the SECRET material:
  # CA/Frontend/GUI private keys + certificates, Client.Crypto, nonce, obfuscation_nonce.
  # Generate it once with `velociraptor config generate` and never hand-edit
  # ports/URLs/paths again — the chart aligns them to the k8s deployment.
  # Derived from existing values: gui.containerPort, gui.publicUrl, gui.oidc.*,
  # frontend.containerPort, frontend.apiPort, frontend.ingress.host, frontend.minions,
  # persistence.mountPath, monitoring.containerPort, serviceMonitor.enabled.
  manageServerConfig: false
  server:
    ## Precedence (low -> high): raw section maps  <  chart-derived fields  <  extraConfig.
    ## Chart-derived (auto, override only via extraConfig): GUI/Frontend/API/Monitoring
    ## bind_address + bind_port, Frontend.hostname, API.hostname/pinned_gw_name (multi-
    ## frontend), Client.server_urls, Datastore.location/filestore_directory.

    # Client.server_urls (agent-facing). Empty -> derived from frontend.ingress.host
    # as ["https://<host>/"]. Set explicitly if agents reach the frontend elsewhere.
    clientServerUrls: []
    # Datastore.implementation. Single-frontend: FileBaseDataStore. For master/minion,
    # set datastore.master_implementation / minion_implementation below.
    datastoreImplementation: "FileBaseDataStore"
    logging:
      separateLogsPerComponent: true
      # Empty -> leave the base/default. Otherwise Logging.output_directory.
      outputDirectory: ""
      rotationTime: 604800     # 7d
      maxAge: 31536000         # 365d
      # Remote syslog (empty -> omit).
      remoteSyslogServer: ""   # e.g. "siem.example:514"
      remoteSyslogProtocol: ""  # tcp | udp
      remoteSyslogComponents: []

    ## Raw per-section passthrough — keys use the UPSTREAM config field names verbatim
    ## (see https://raw.githubusercontent.com/Velocidex/velociraptor/refs/heads/master/docs/references/server.config.yaml).
    ## Anything here is merged in; chart-derived fields above still win. Put NO secrets here.
    # Client tuning, e.g. { max_poll: 60, max_upload_size: 5242880, use_self_signed_ssl: true,
    #   pinned_server_name: VelociraptorServer, proxy: "", local_buffer: { disk_size: 1073741824 } }
    client: {}
    # API extras, e.g. { bind_scheme: tcp }
    api: {}
    # GUI extras, e.g. { base_path: /, use_plain_http: false, allowed_cidr: [...],
    #   trusted_origins: [...], links: [...], reverse_proxy: [...] }
    gui: {}
    # Frontend extras, e.g. { use_plain_http: false, require_client_certificates: false,
    #   do_not_compress_artifacts: true, GRPC_pool_max_size: 100, default_client_monitoring_artifacts: [...],
    #   resources: { expected_clients: 30000, connections_per_second: 100, max_upload_size: 104857600 } }
    frontend: {}
    # Datastore extras, e.g. { master_implementation: MemcacheFileDataStore,
    #   minion_implementation: RemoteFileDataStore, compression: zlib, max_object_size: 4194304 }
    datastore: {}
    # Monitoring extras (bind_address/bind_port are chart-derived).
    monitoring: {}
    # defaults.* — e.g. { hunt_expiry_hours: 168, backup_period_seconds: 86400,
    #   notebook_cell_timeout_min: 10, export_concurrency: 10, disable_unicode_usernames: false }
    defaults: {}
    # security.* — e.g. { certificate_validity_days: 365, denied_plugins: [...], vql_must_use_secrets: false }
    security: {}
    # Minion.* — notebook worker overrides for multi-frontend.
    minion: {}

    ## Top-level scalars (empty/null -> omit).
    serverType: ""             # server_type, e.g. "linux"
    autocertDomain: ""         # autocert_domain (Let's Encrypt on :443 for frontend+GUI)
    autocertCertCache: ""      # autocert_cert_cache (writable dir/datastore path)
    lockdown: null             # true/false -> lockdown (read-only server mode)
    debugMode: null            # true/false -> debug_mode

    # Raw YAML deep-merged LAST onto the rendered overlay (overrides EVERYTHING above).
    extraConfig: {}

  # Build downloadable client installers (MSI/DEB/RPM) — the upstream image's
  # first-boot behaviour. Injects (via the overlay merge)
  # `Frontend.initial_server_artifacts: [Container.InitializeServer]` so the
  # server packages clients on startup (visible in the GUI). Needs a writable
  # datastore (default) + tmpDir.enabled (default). Triggers the overlay merge.
  initializeServer: false
  # Config overlay: a yq init container deep-merges a chart-rendered overlay onto
  # the base config at startup (the base, with CA/keys, stays untouched in its
  # Secret). Auto-enabled when gui.oidc.enabled. Used to inject OIDC without the
  # chart owning the whole config. The merged file is written to a writable
  # emptyDir and read by the main container at config.mountPath.
  overlay:
    image:
      repository: mikefarah/yq
      tag: "4.44.6"
      # Pin by digest in production.
      digest: "sha256:b1d117c609ba990436ad1649299e2f6c378f62cb562caf30b6f2fb6144713422"
      pullPolicy: IfNotPresent

## replicaCount controls the number of MASTER pods. Keep at 1: the master holds
## the single-writer metadata datastore. Scale client capacity with frontend.minions
## (master/minion), NOT by raising this.
replicaCount: 1

## Frontend = client comms (gRPC/mTLS). Must be reachable by endpoints (often external).
frontend:
  containerPort: 8000
  # Master API (gRPC) port. Minions connect here for RemoteFileDataStore RPCs.
  apiPort: 8001
  service:
    type: LoadBalancer
    port: 8000
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: Local

  ## SSL-passthrough Ingress for agent comms (alternative to a LoadBalancer Service).
  ## The frontend speaks mTLS and presents its OWN cert (from the server config), so the
  ## ingress controller must forward raw TLS (L4) WITHOUT terminating it — agents validate
  ## the cert against the pinned CA. With service.type ClusterIP, this is how endpoints reach
  ## the frontend through an nginx ingress instead of an LB.
  ## PREREQUISITES:
  ##  - the nginx ingress controller runs with `--enable-ssl-passthrough`.
  ##  - `host` is DISTINCT from gui.ingress hosts (one host:443 can't be both L4 and L7).
  ##  - Client.server_urls in the server config points at https://<host>/.
  ingress:
    enabled: false
    className: ""
    # Agent SNI host — must match Client.server_urls / Frontend.hostname in the config.
    host: ""
    path: /
    # ImplementationSpecific lets nginx route by SNI for passthrough.
    pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Usually empty: TLS is terminated by the frontend itself, not the controller.
    tls: []

  ## Multi-frontend (master/minion) horizontal scaling.
  ## Docs: https://docs.velociraptor.app/docs/deployment/server/multifrontend/
  ## PREREQUISITES (all enforced/asserted by the chart or required in your config):
  ##  - persistence.existingClaim set to a ReadWriteMany volume (NFS/EFS) — master
  ##    and all minions share one filestore. (chart fails the render otherwise.)
  ##  - API.bind_address 0.0.0.0, API.hostname <fullname>-api.<namespace>.svc and
  ##    API.pinned_gw_name GRPC_GW are DERIVED when the chart manages the config
  ##    (bootstrap / manageServerConfig); otherwise your config must set them.
  ##  - Set in config.server (or your config):
  ##      datastore: { master_implementation: MemcacheFileDataStore,
  ##                   minion_implementation: RemoteFileDataStore }
  ##      extraConfig.ExtraFrontends: one entry per minion, hostname "<fullname>-minion-0"
  ##        .. "-N", bind_address 0.0.0.0 / bind_port 8000. The chart starts each minion
  ##        with `--node <hostname>-<bind_port>` (hyphen, e.g. ...-minion-0-8000).
  ##  - Client.server_urls should point at the frontend Service (LB fronts all frontends).
  ## NOTE: Velociraptor 0.76.6 has an upstream nil-pointer panic in the minion's
  ## RemoteFileDataStore (datastore/remote.go ListChildren), tracked around
  ## Velocidex/velociraptor#4816. The chart topology is correct (minion connects and
  ## the ReplicationService links to the master), but minion bring-up may crash until
  ## that upstream fix lands. Single-frontend (master only) is unaffected.
  minions:
    enabled: false
    replicas: 2
    resources: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

## GUI = admin web UI. Keep internal / behind VPN or authenticated Ingress.
gui:
  containerPort: 8889
  # GUI.public_url — the externally-reachable GUI URL. Velociraptor REQUIRES it to
  # end with "/app/index.html". REQUIRED for OIDC (OAuth redirects). Match the host
  # to your Ingress, e.g. https://velociraptor.example.com/app/index.html
  # The OAuth callback Velociraptor derives (register it in the IdP) is:
  #   <scheme>://<host>/auth/oidc/<gui.oidc.name>/callback
  publicUrl: ""
  # GUI.base_path — served sub-path behind a reverse proxy (only with manageServerConfig).
  basePath: ""
  ## Initial administrator. An init container runs `velociraptor user add --role
  ## administrator <username> <password>` on every master start, so the account always
  ## exists and its password always matches the Secret (the Secret is the source of truth:
  ## a password changed in the GUI reverts at the next restart).
  ## With OIDC, set username to the admin's identity (e-mail): the role is granted to it
  ## and the password is unused.
  initialAdmin:
    enabled: true
    username: "admin"
    # Secret holding the password. Empty -> the PKI job generates a random one in
    # <fullname>-admin (read it with: kubectl get secret <fullname>-admin -o
    # jsonpath='{.data.password}' | base64 -d).
    existingSecret: ""
    passwordKey: "password"
  ## OIDC authentication (e.g. Keycloak). When enabled, the chart renders an
  ## overlay (GUI.public_url + GUI.authenticator) and merges it onto the base
  ## config via the yq init container (see config.overlay).
  ## Keycloak "Valid redirect URIs" must include:
  ##   <publicUrl>auth/oidc/<name>/callback
  ## oidc_name must match (case-sensitive) the substring in that redirect URI.
  ## Authn is delegated to the IdP; authorization still needs a Velociraptor user:
  ##   velociraptor --config <cfg> user add <email> --role administrator
  ## NOTE: OIDC discovery is fetched EAGERLY at server start — the IdP must be
  ## reachable from the pod or the server won't boot. With networkPolicy.enabled,
  ## add an egress rule to the issuer (443) via networkPolicy.extraEgress.
  ## Docs: https://docs.velociraptor.app/knowledge_base/tips/setup_keycloak/
  oidc:
    enabled: false
    name: "keycloak"
    issuer: ""          # e.g. https://keycloak.example.com/realms/dfir
    clientId: "velociraptor"
    avatar: ""          # optional icon URL shown on the login button
    # Client secret source. Prefer existingSecret (ESO/Vault) when available;
    # otherwise set clientSecret inline (chart-managed Secret) — keep it out of git
    # in a gitignored overrides file. existingSecret wins if both are set.
    existingSecret: ""
    existingSecretKey: "oauth_client_secret"
    clientSecret: ""
  service:
    type: ClusterIP
    port: 8889
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: velociraptor.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

## Prometheus metrics endpoint (Velociraptor Monitoring service).
## Monitoring.bind_address defaults to 127.0.0.1 (not scrapable). When the chart manages
## the config (bootstrap / manageServerConfig) it is set to 0.0.0.0 with
## serviceMonitor.enabled; otherwise your config must set it (and bind_port below).
monitoring:
  containerPort: 8003

## Datastore volume.
## Single-frontend: a chart-managed RWO PVC (volumeClaimTemplate) is enough.
## External / scalable store: Velociraptor scales storage over a DISTRIBUTED
## FILESYSTEM (NFS, AWS EFS, GCP Filestore) mounted at Datastore.location — there
## is no native S3/object server datastore (S3 is only a VQL accessor).
## To use one, provision a ReadWriteMany PVC out-of-band (NFS/EFS CSI) and set
## persistence.existingClaim to it. This is also the prerequisite for a
## multi-frontend (master/minion) deployment.
## Docs: https://docs.velociraptor.app/docs/deployment/server/multifrontend/
persistence:
  enabled: true
  # Use an existing, externally-provisioned PVC (e.g. NFS/EFS RWX) instead of a
  # chart-managed volumeClaimTemplate. When set, storageClass/accessModes/size
  # below are ignored (the bound PV governs them).
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}
  # Mount point for the datastore + filestore (must match config Datastore paths).
  mountPath: "/datastore"

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

## Pod-level security context (rootless, fsGroup for the datastore PVC).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

## Container-level security context (hardened).
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

priorityClassName: ""
terminationGracePeriodSeconds: 60

# Probes hit the frontend's unauthenticated /healthz over HTTPS (returns 200).
# A full TLS handshake is completed, so the server does not log
# "TLS handshake error ... EOF" the way a bare tcpSocket probe does.
# kubelet does not verify the server certificate for httpGet probes.
livenessProbe:
  httpGet:
    path: /healthz
    port: frontend
    scheme: HTTPS
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /healthz
    port: frontend
    scheme: HTTPS
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

networkPolicy:
  enabled: true
  # CIDRs allowed to reach the frontend (endpoint clients). Tighten in production.
  frontendAllowedCIDRs:
    - 0.0.0.0/0
  # Sources allowed to reach the GUI (e.g. the ingress controller namespace).
  # Each item is a standard NetworkPolicyPeer (namespaceSelector/podSelector/ipBlock).
  guiAllowedFrom: []
  # Sources allowed to scrape the metrics port (only applied when serviceMonitor
  # is enabled). Empty = allow all in-cluster; set to the Prometheus namespace to
  # tighten. Each item is a standard NetworkPolicyPeer.
  metricsAllowedFrom: []
  # Egress to the OIDC IdP, allowed only when gui.oidc.enabled (discovery is
  # fetched at boot). NetworkPolicy is CIDR-based (no DNS), so list the IdP's
  # CIDR(s). Default 0.0.0.0/0 = reach any HTTPS endpoint — TIGHTEN in production.
  oidcEgressCIDRs:
    - 0.0.0.0/0
  # Port of the OIDC issuer (HTTPS).
  oidcEgressPort: 443
  # Extra egress rules appended (DNS is always allowed).
  extraEgress: []

podDisruptionBudget:
  # Off by default: with replicaCount=1, a PDB would block node drains/upgrades.
  enabled: false
  minAvailable: ""
  maxUnavailable: ""

serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  # Scrapes the monitoring port (8003). Requires Monitoring.bind_address: 0.0.0.0
  # in the server config (see monitoring: above).
  port: metrics
  path: /metrics
  scheme: http

# Custom VQL artifact definitions, mounted read-only and loaded by the server.
# When enabled, the chart injects `defaults.artifact_definitions_directories`
# into the config (via the overlay merge) so Velociraptor reads `path`.
# The image ships an empty /custom_artifacts as the default mountpoint.
customArtifacts:
  enabled: false
  path: /custom_artifacts
  # Use an existing ConfigMap (keys = *.yaml artifact files). Takes precedence
  # over `files`.
  existingConfigMap: ""
  # Inline artifacts: map of filename -> YAML content (chart-managed ConfigMap).
  files: {}
  #   My.Custom.Artifact.yaml: |
  #     name: My.Custom.Artifact
  #     type: CLIENT
  #     sources:
  #       - query: SELECT * FROM info()

# Writable scratch space (root fs is read-only).
tmpDir:
  enabled: true
  sizeLimit: 1Gi

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
extraArgs: []
