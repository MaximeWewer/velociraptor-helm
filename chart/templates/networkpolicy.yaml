{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "velociraptor.fullname" . }}
  labels:
    {{- include "velociraptor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "velociraptor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Frontend: endpoint clients (gRPC/mTLS). Often external => CIDR-gated.
    - from:
        {{- range .Values.networkPolicy.frontendAllowedCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.containerPort }}
    # GUI: restricted to declared sources (e.g. ingress controller). If empty, GUI
    # is only reachable in-cluster via explicit peers added here.
    {{- with .Values.networkPolicy.guiAllowedFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.gui.containerPort }}
    {{- end }}
    # `helm test` pod of this release (frontend + GUI checks); only exists during the test.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
      ports:
        - protocol: TCP
          port: {{ .Values.gui.containerPort }}
        - protocol: TCP
          port: {{ .Values.frontend.containerPort }}
    {{- if eq (include "velociraptor.apiServed" .) "true" }}
    # Master API (gRPC): the release's own pods (master through its Service, minions for
    # RemoteFileDataStore) and, with api.expose, the declared peers (e.g. Tracecat).
    - from:
        - podSelector:
            matchLabels:
              {{- include "velociraptor.selectorLabels" . | nindent 14 }}
        {{- if .Values.api.expose.enabled }}
        {{- with .Values.api.expose.allowedFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.apiPort }}
    {{- end }}
    {{- if .Values.serviceMonitor.enabled }}
    # Metrics: allow Prometheus to scrape the monitoring port.
    - from:
        {{- with .Values.networkPolicy.metricsAllowedFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        []
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.monitoring.containerPort }}
    {{- end }}
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if eq (include "velociraptor.apiServed" .) "true" }}
    # Master API: minions, and API clients inside the master pod (through the Service), dial it.
    - to:
        - podSelector:
            matchLabels:
              {{- include "velociraptor.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: master
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.apiPort }}
    {{- end }}
    {{- if .Values.gui.oidc.enabled }}
    # OIDC: reach the IdP issuer (discovery fetched at server boot).
    - to:
        {{- range .Values.networkPolicy.oidcEgressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.oidcEgressPort }}
    {{- end }}
    {{- if .Values.config.initializeServer }}
    # Container.InitializeServer downloads the client binaries (GitHub releases) to build
    # the MSI/DEB/RPM installers on first start.
    - to:
        {{- range .Values.networkPolicy.toolsEgressCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
