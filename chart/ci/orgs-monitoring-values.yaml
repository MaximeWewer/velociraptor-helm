# ct install: orgs reconciler sidecar + metrics port, behind an SSL-passthrough Ingress object.
frontend:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    host: agents.ct.test
gui:
  publicUrl: https://gui.ct.test/app/index.html
persistence:
  size: 1Gi
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
orgs:
  items:
    - {id: O01, name: "CI org"}
api:
  expose:
    enabled: true
apiClients:
  - name: ci-client
    roles: [api, reader]
state:
  orgs:
    - id: root
      users:
        - {name: ci-user, roles: [reader]}
      serverMonitoring: [Server.Monitor.Health]
