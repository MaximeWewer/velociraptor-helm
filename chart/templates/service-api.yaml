{{- if eq (include "velociraptor.apiServed" .) "true" }}
# Master API (gRPC, mTLS with API client certificates): minions (RemoteFileDataStore) and
# api.expose clients. API.hostname is set to {{ include "velociraptor.fullname" . }}-api.{{ .Release.Namespace }}.svc
# when the chart manages the config.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "velociraptor.fullname" . }}-api
  labels:
    {{- include "velociraptor.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.frontend.apiPort }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "velociraptor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: master
{{- end }}
